# Cấu hình deploy Render (Blueprint)
# Gói free: server ngủ khi không ai chơi và ổ đĩa bị xóa mỗi lần khởi động lại.
# Để KHÔNG mất tài khoản: dùng database Turso (miễn phí) bằng cách điền TURSO_DATABASE_URL và
# TURSO_AUTH_TOKEN ở Render > Environment (hai biến bên dưới để sync:false, không lưu trong repo).
services:
  - type: web
    name: thien-menh-the-bai
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /data/thebai.db
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
    # disk:
    #   name: thebai-data
    #   mountPath: /data
    #   sizeGB: 1
